name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Validate city config and data
        working-directory: app
        run: npm run validate:data -- --all

      - name: Build
        working-directory: app
        env:
          # Optional repo variable (Settings > Secrets and variables > Actions >
          # Variables). Overrides serviceGuideUrl in the city config; when both
          # are unset the Service Guide links are hidden.
          VITE_SERVICE_GUIDE_URL: ${{ vars.SERVICE_GUIDE_URL }}
          # Opt-in individual lifespan calculator. Only the exact value "true"
          # enables it; unset/anything else keeps the aggregate-data-only app.
          VITE_ENABLE_PERSONAL_CALCULATOR: ${{ vars.ENABLE_PERSONAL_CALCULATOR }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

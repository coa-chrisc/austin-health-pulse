name: CI

# Checks every pull request (including from forks) without deploying.
# The Pages deploy runs from deploy.yml on pushes to main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Validate city config and data
        working-directory: app
        run: npm run validate:data -- --all

      - name: Build
        working-directory: app
        run: npm run build

      - name: Build partner-city preset
        working-directory: app
        env:
          CITY_CONFIG: presets/partner-city-demo.json
          BASE_PATH: /
        run: npm run build -- --outDir dist-partner

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check pipeline scripts compile
        run: python -m compileall -q scripts

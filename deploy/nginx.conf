# Replaces /etc/nginx/conf.d/default.conf in nginx-unprivileged (listens on 8080 as non-root).
# Caching uses `expires` rather than add_header on purpose: add_header inside a location
# discards the server-level security headers below.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSP: scripts, styles, fonts and connections limited to self (fonts are bundled); map tiles from OSM only.
    # style-src needs 'unsafe-inline' because React/Leaflet set inline style attributes.
    # data: images cover Leaflet marker/icon data URIs. No unsafe-eval.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Used by container HEALTHCHECK and load balancer probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames here, so they are safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # HashRouter means all routes live after '#', so only "/" and index.html are ever requested.
    location / {
        expires -1;  # emits Cache-Control: no-cache
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
